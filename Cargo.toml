[package]
name = "udb-lab"
version = "0.1.0"
edition = "2021"
description = "Kernel laboratory for universal database architecture research"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
