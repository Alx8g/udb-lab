name: SPI native storage

on:
  push:
    branches: [main, feat/spi-native-store]
  pull_request:
    paths:
      - 'src/spi/**'
      - 'src/lib.rs'
      - 'src/bin/spi*'
      - 'tests/spi*'
      - 'scripts/*spi*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/spi.yml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test local storage, transactions and process crashes
        run: cargo test --locked --all-targets --features rusqlite -- --test-threads=1
      - name: Test optimized storage, concurrency and process-crash paths
        run: cargo test --locked --release --lib --test spi-storage --test spi-concurrency --test spi-process --test spi-grouped -- --test-threads=1
      - name: Test benchmark provenance validation
        run: python scripts/test_spi_benchmark_identity.py
      - name: Test benchmark result-contract validation
        run: python scripts/test_spi_campaign.py
      - name: Build native comparison adapter
        run: cargo build --locked --release --features rusqlite --bin spi-compare
      - name: Smoke-test identified comparison binary
        shell: bash
        run: |
          mkdir -p .working/tmp/ci
          python scripts/run_spi_campaign.py --binary "target/release/spi-compare${{ runner.os == 'Windows' && '.exe' || '' }}" --out .working/tmp/ci/identified-smoke --rows 100 --seeds 17 --engines spi spi-value-cache spi-grouped sqlite
