name: SPI native storage

on:
  push:
    branches: [main, feat/spi-native-store]
  pull_request:
    paths:
      - 'src/spi/**'
      - 'src/lib.rs'
      - 'src/bin/spi*'
      - 'src/bin/spi-compare/**'
      - 'tests/spi*'
      - 'scripts/*spi*'
      - 'scripts/*engine*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/spi.yml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test local storage, transactions and process crashes
        run: cargo test --locked --all-targets --features rusqlite -- --test-threads=1
      - name: Test optimized storage, concurrency and process-crash paths
        run: cargo test --locked --release --lib --test spi-storage --test spi-concurrency --test spi-process --test spi-grouped --test spi-packed --test spi-profile -- --test-threads=1
      - name: Test legacy CRC interoperability control
        run: cargo test --locked --release --lib --test spi-packed --features spi-crc-bitwise -- --test-threads=1
      - name: Test materialized packed-scan control
        run: cargo test --locked --release --lib --test spi-packed --features spi-scan-materialized -- --test-threads=1
      - name: Test direct-base materialized-delta control
        run: cargo test --locked --release --lib --test spi-packed --features spi-delta-materialized -- --test-threads=1
      - name: Test benchmark provenance validation
        run: python scripts/test_spi_benchmark_identity.py
      - name: Test benchmark result-contract validation
        run: python scripts/test_spi_campaign.py
      - name: Test external engine capability and safety contracts
        run: |
          python scripts/test_engine_capabilities.py
          python scripts/test_external_engine_results.py
          python scripts/test_spi_postgres_campaign.py
          python scripts/test_retain_engine_campaign.py
          python scripts/test_summarize_multi_engine.py
          python scripts/test_summarize_engine_profiles.py
      - name: Test lightweight optional engine adapters
        run: cargo test --locked --bin spi-compare --features "rusqlite redb lmdb libloading postgres" -- --test-threads=1
      - name: Test diagnostic-profile contract validation
        run: python scripts/test_spi_profile.py
      - name: Test paired checksum campaign contracts
        run: python scripts/test_spi_crc_campaign.py
      - name: Test paired scan campaign contracts
        run: python scripts/test_spi_scan_campaign.py
      - name: Test diagnostic-only implementation
        run: cargo test --locked --lib --bin spi-compare --test spi-profile --features "rusqlite spi-profile" -- --test-threads=1
      - name: Build native comparison adapter
        run: cargo build --locked --release --features rusqlite --bin spi-compare
      - name: Smoke-test identified comparison binary
        shell: bash
        run: |
          mkdir -p .working/tmp/ci
          python scripts/run_spi_campaign.py --binary "target/release/spi-compare${{ runner.os == 'Windows' && '.exe' || '' }}" --out .working/tmp/ci/identified-smoke --rows 100 --seeds 17 --engines spi spi-value-cache spi-grouped spi-packed sqlite
      - name: Build diagnostic-only adapter
        run: cargo build --locked --release --features "rusqlite spi-profile" --bin spi-compare
      - name: Smoke-test identified diagnostics
        shell: bash
        run: |
          python scripts/run_spi_profile.py --binary "target/release/spi-compare${{ runner.os == 'Windows' && '.exe' || '' }}" --out .working/tmp/ci/identified-profile --rows 100 --seeds 17 --engines spi spi-packed sqlite
